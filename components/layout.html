<!--
  LAYOUT PRIMITIVES — use these instead of any custom spacing.
  .page (max-width container with side gutters; --read for single-column reading width)
  .stack (vertical gap; --xs --sm --lg --xl) · .cluster (wrapping row; --between --end --lg)
  .grid --2 / --3 / --4 (collapse to 1 column on phones) · .split (sidebar + main at ≥64rem; --wide-side)
  .focus (centered reading column + side panel docked on its left; see focus-layout.html) · .page--full (uncapped width)
  .section + .section-head (h2 + description + actions) for each block on a page.
  Page heading pattern: .section-head with an h1; an .eyebrow above it only when it adds a fact the h1 lacks.
  Text helpers: .eyebrow .lead .muted .small .xsmall .strong .num .truncate .nowrap .visually-hidden .no-print
-->
